# =============================================================================
# baseline.yaml — 基准定义（纯计算组件，不抓取行情）
#
# 数据来源：data_pipeline 维护的 market.duckdb
#   - 个股行情：fact_daily / fact_daily_basic / fact_adj_factor
#   - 指数行情：fact_index_daily
#   - ETF 行情：fact_fund_daily（需 data_pipeline 先导入）
#   - 指数成分：fact_index_weight（动态标的池）
#
# 产出：backtest.duckdb
#   - bt_benchmarks / bt_baselines / bt_baseline_weights / bt_compute_log
#
# 约定：
#   - 日期 "YYYY-MM-DD"，区间左闭右闭；end 为 null 表示“至今”
#   - 代码统一为 "<6位数字>.<交易所>"，如 600519.SH
#   - code（UNI_* / BI_*）是稳定标识，入库后不可改名
#   - 未知字段会让 ConfigError 直接失败，避免拼写错误被静默忽略
# =============================================================================

version: 1

# ------------------------------------------------------------------ 全局默认 --
defaults:
  calendar: SSE
  price_field: close
  # 收益率口径：
  #   pct_chg = 用 Tushare 的涨跌幅（已做除权处理，推荐，且不依赖 adj_factor）
  #   hfq/qfq = 用 adj_factor 复权价
  #   none    = 原始收盘价（分红日会有跳空）
  adjust: pct_chg
  missing_policy: drop      # drop | forward_fill | hold
  warmup_days: 40           # 为 T-1 市值 / 前收盘预取的日历天数
  base_date: "2015-01-05"
  base_value: 1000.0
  rebalance:
    frequency: monthly       # daily | weekly | monthly | quarterly | none
    align: first_trading_day # first_trading_day | last_trading_day
  weight:
    method: equal            # equal | market_cap | fixed

# ------------------------------------------------------------------ 标的池 --
universes:
  # 静态成分：直接在 members 中维护
  - code: UNI_CN_A_CORE
    name: A股核心池
    description: 用于打通流程的 5 只大市值样本
    members:
      - { symbol: 600519.SH, name: 贵州茅台, start: "2015-01-05", end: null }
      - { symbol: 000858.SZ, name: 五粮液,   start: "2015-01-05", end: null }
      - { symbol: 600036.SH, name: 招商银行, start: "2015-01-05", end: null }
      - { symbol: 000001.SZ, name: 平安银行, start: "2015-01-05", end: null }
      - { symbol: 601318.SH, name: 中国平安, start: "2015-01-05", end: null }

  # 动态成分：从 market.duckdb 的 fact_index_weight 读取快照，不在本地抓取
  - code: UNI_HS300
    name: 沪深300 成分
    members: []
    constituents_source:
      kind: warehouse
      api: index_weight
      index_code: "000300.SH"
      refresh: monthly
      lookback_days: 45

# ------------------------------------------------------------------ 基准 --
benchmarks:
  # 1) 外部指数：直接使用指数自身点位
  - code: BI_HS300
    name: 沪深300
    kind: external
    category: index
    symbol: "000300.SH"
    price_field: close
    base_date: "2015-01-05"
    enabled: true

  # 2) 外部 ETF：用 fact_fund_daily 的收盘价；需 data_pipeline 先导入 ETF
  - code: BI_HS300_ETF
    name: 华泰柏瑞沪深300ETF
    kind: external
    category: etf
    symbol: "510300.SH"
    price_field: close
    base_date: "2015-01-05"
    enabled: false

  # 3) 自建等权基准
  - code: BI_EQW_CORE
    name: 核心池等权
    kind: synthetic
    universe: UNI_CN_A_CORE
    weight:
      method: equal
    rebalance:
      frequency: monthly
      align: first_trading_day
    base_date: "2015-01-05"
    base_value: 1000.0
    enabled: true

  # 4) 自建市值加权基准：T-1 市值定权，避免前视
  #    需要 fact_daily_basic 有数据；未导入前置 false
  - code: BI_MCW_CORE
    name: 核心池市值加权
    kind: synthetic
    universe: UNI_CN_A_CORE
    weight:
      method: market_cap
      field: total_mv
      lag: 1
    rebalance:
      frequency: monthly
      align: first_trading_day
    base_date: "2015-01-05"
    base_value: 1000.0
    enabled: false

  # 5) 动态池等权基准：需要 fact_index_weight 有数据
  - code: BI_EQW_HS300
    name: 沪深300等权
    kind: synthetic
    universe: UNI_HS300
    weight:
      method: equal
    rebalance:
      frequency: monthly
      align: first_trading_day
    base_date: "2015-01-05"
    base_value: 1000.0
    enabled: false

# ------------------------------------------------------------------ 同步 --
sync:
  start_date: "2015-01-05"
  end_date: null
  incremental_lookback_days: 5
  chunk_days: 365
  trade_calendar: SSE
  write_mode: upsert
