# =============================================================================
# database.yaml — 统一数据底座的连接与写入约定
#
# 设计：
#   - market.duckdb   由 data_pipeline 维护；quant-baseline 只读打开
#   - backtest.duckdb 由 quant-backtest-engine 建表；quant-baseline 只 upsert
#   - 本项目不建表，不创建独立 baseline.db / SQLite 备选库
#
# 占位符：${VAR}，必须由环境变量 / .env 提供；不在 YAML 中写死机器路径。
# =============================================================================

version: 1

active_profile: production

profiles:
  production:
    market_db_path: "${MARKET_DB_PATH}"
    backtest_db_path: "${BACKTEST_DB_PATH}"
    market_read_only: true       # 必须只读：data_pipeline / factor 可能在写
    threads: 6
    memory_limit: 6GB
    temp_dir: null

  research:
    market_db_path: "${MARKET_DB_PATH}"
    backtest_db_path: "${BACKTEST_DB_PATH}"
    market_read_only: true
    threads: 4
    memory_limit: 4GB
    temp_dir: null

  test:
    market_db_path: "${MARKET_TEST_DB_PATH}"
    backtest_db_path: "${BACKTEST_TEST_DB_PATH}"
    market_read_only: true
    threads: 4
    memory_limit: 4GB
    temp_dir: null

# ------------------------------------------------------------------ 会话级 --
session:
  timezone: Asia/Shanghai
  lock_wait_seconds: 30

# ------------------------------------------------------------------ 写入约定 --
sink:
  table: "bt_baselines"                    # 基准点位主表
  conflict_keys: ["benchmark_id", "trade_date"]
  batch_size: 10000
  verify_after_write: true

  # 其余表的主键；表名与字段名来自 quant_schema.constants
  tables:
    bt_benchmarks: ["benchmark_id"]
    bt_baselines: ["benchmark_id", "trade_date"]
    bt_baseline_weights: ["benchmark_id", "trade_date", "symbol"]
    bt_compute_log: ["run_id"]
