[project]
name = "quant-baseline"
version = "0.3.0"
description = "A Python package for quantitative baseline analysis in finance and data science."
authors = [
    { name = "Kalofaws"}
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "polars>=2.1.0",
    "pre-commit>=4.7.0",
    "pyarrow>=26.0.1",
    "pytz>=2026.6",
    "pyyaml>=6.0.3",
    "quant-data-pipeline",
    "quant-db-schema",
]

[project.scripts]
quant-baseline = "quant_baseline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_baseline"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
extraPaths = ["src"]

[tool.uv.sources]
quant-db-schema = { path = "../quant-db-schema", editable = true }
quant-data-pipeline = { path = "../quant-data-pipeline", editable = true }
