[project]
name = "quant-baseline"
version = "0.1.0"
description = "A Python package for quantitative baseline analysis in finance and data science."
authors = [
    { name = "Kalofaws"}
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "vectorbt>=1.2.0",
]

[project.scripts]
quant-baseline = "quant_baseline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
