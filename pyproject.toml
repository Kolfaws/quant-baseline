# =============================================================================
# pyproject.toml — quant-baseline 项目元数据与工具配置
#
# 安装：  uv sync --extra dev        （或 pip install -e ".[dev]"）
# 构建：  uv build
# 说明：  依赖锁定交给 uv.lock；本文件只声明可接受的版本区间。
# =============================================================================

[project]
name = "quant-baseline"
version = "0.1.0"
description = "基准（baseline）数据同步与基准指数计算：Source → Processor → Sink，多表写入 DuckDB / SQLite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["quant", "baseline", "benchmark", "index", "duckdb", "tushare"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

# 核心依赖：只装跑通“取数 → 清洗 → 加权 → 落库”所需的包
dependencies = [
    "duckdb>=1.1.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "polars>=1.0.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "tushare>=1.2.0",
]

[project.optional-dependencies]
# 备选数据源：akshare 依赖较重（会带入 requests/beautifulsoup 等），按需安装
akshare = ["akshare>=1.14.0"]

# 开发工具链
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.1",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src 布局：实际包在 src/quant_baseline
packages = ["src/quant_baseline"]

[tool.hatch.build.targets.sdist]
include = [
    "src/quant_baseline",
    "configs",
    "docs",
    "scripts",
    "tests",
    "README.md",
    "pyproject.toml",
]

# =============================================================================
# Ruff —— 代码检查与格式化
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "scripts", "tests"]
extend-exclude = ["data", "warehouse", "logs", "build", "dist"]

[tool.ruff.lint]
# 新建项目直接启用 import 排序 / 语法升级 / bugbear / 简化建议
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # 行长度交给 ruff-format 控制
]

[tool.ruff.lint.isort]
known-first-party = ["quant_baseline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: 慢速用例（大批量计算、全量回补）",
    "integration: 需要真实 warehouse 文件的用例",
    "network: 需要访问外部数据源的用例",
]
filterwarnings = [
    "error::DeprecationWarning:quant_baseline.*",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["quant_baseline"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================================
# Mypy —— 渐进式类型检查（新代码要求类型注解）
# =============================================================================
[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tushare.*", "akshare.*", "duckdb.*"]
ignore_missing_imports = true
